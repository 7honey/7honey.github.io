	function preloadImages(urls, callback) {

// ================= 新增：心形 3D 坐标计算函数 =================
/**
 * 生成一个实心心形的 3D 坐标
 * 基于 2D 参数方程绕 Y 轴旋转而成
 */
function getHeartTarget(size) {
    // t 用于生成 2D 心形轮廓 (0 到 2PI)
    let t = Math.random() * 2 * Math.PI;
    // phi 用于绕 Y 轴旋转生成 3D 效果 (0 到 2PI)
    let phi = Math.random() * 2 * Math.PI;

    // 标准 2D 心形参数方程
    // x = 16sin^3(t)
    // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
    let hx = 16 * Math.pow(Math.sin(t), 3);
    let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

    // 缩放因子，将数学公式的值映射到我们的 EXPLOSION_RADIUS
    // 该公式产生的最大半径大约是 17 左右，以此做归一化
    let scale = size / 17;

    // 体积噪音：为了让心形看起来是实心的，而不是一个空壳
    // 使用幂函数让大部分粒子分布在表面 (接近1)，少部分在内部
    let volumeNoise = 1 - Math.pow(Math.random(), 3) * 0.6; 

    // 绕 Y 轴旋转组合成 3D 坐标
    // hx 作为旋转半径
    let finalX = hx * Math.cos(phi) * scale * volumeNoise;
    let finalZ = hx * Math.sin(phi) * scale * volumeNoise;
    // 反转 Y 轴让尖端向下 (符合重力感)，并应用缩放
    let finalY = -hy * scale * volumeNoise;

    // 添加一些随机抖动，让边缘不那么生硬
    let jitter = 15;
    
    return {
        x: finalX + (Math.random() - 0.5) * jitter,
        // 加一个垂直偏移量 size * 0.2，让心形视觉中心向上提一点，更居中
        y: finalY + size * 0.2 + (Math.random() - 0.5) * jitter,
        z: finalZ + (Math.random() - 0.5) * jitter
    };
}

    // ================= 3D 类定义 =================

    // 基础 3D 点类
    class Point3D {
        constructor(x, y, z) {
            this.baseX = x; this.baseY = y; this.baseZ = z;
            this.x = x; this.y = y; this.z = z;
            this.scale = 0; this.screenX = 0; this.screenY = 0;
            
            // 粒子爆炸目标位置 (仅用于Particle类)
            this.targetX = 0;
            this.targetY = 0;
            this.targetZ = 0;
        }

        project(x, y, z, rotation) {
            const cos = Math.cos(rotation);
            const sin = Math.sin(rotation);
            const rx = x * cos - z * sin;
            const rz = x * sin + z * cos;
            const scale = PERSPECTIVE / (PERSPECTIVE + rz + Z_OFFSET);
            return {
                sx: width / 2 + rx * scale,
                sy: height / 2 + y * scale,
                scale: scale,
                rz: rz
            };
        }
        
        // 旋转更新逻辑 (仅旋转 base position)
        update(rotation) {
            const p = this.project(this.baseX, this.y, this.baseZ, rotation);
            this.screenX = p.sx;
            this.screenY = p.sy;
            this.scale = p.scale;
            this.z = p.rz;
        }
    }

    // 普通粒子 (叶子/树干) - 增加了爆炸和过渡逻辑
    class Particle extends Point3D {

            this.sizeBase = type === 'leaf' ? (Math.random() * 3.5 + 1) : (Math.random() * 4 + 1.5);
            this.twinkleOffset = Math.random() * 100;
            
            <!-- if (type === 'trunk') { -->
                <!-- this.color = `rgba(${60+Math.random()*30}, ${40+Math.random()*20}, 20,`;  -->
            <!-- } else { -->
                 <!-- const shade = Math.random(); -->
                 <!-- let r, g, b; -->
                 <!-- if (shade > 0.95) { r=220; g=220; b=150; }  -->
                 <!-- else if (shade > 0.85) { r=30; g=180; b=60; }  -->
                 <!-- else { r=20; g=Math.floor(Math.random()*100+80); b=30; }  -->
                <!-- this.color = `rgba(${r}, ${g}, ${b},`;  -->
            <!-- } -->

		if (type === 'trunk') {
		                this.color = `rgba(${60+Math.random()*30}, ${40+Math.random()*20}, 20,`; 
		            } else {
		                // --- START: 树叶颜色修改区域 ---
		                const shade = Math.random();
		                let r, g, b;

		                if (shade > 0.8) { // 约 20% 的机会是高亮金色/黄色
		                    // 亮金色调
		                    r = 255; 
		                    g = Math.floor(200 + Math.random() * 55); // 200-255
		                    b = Math.floor(0 + Math.random() * 80); // 偏黄
		                } else if (shade > 0.5) { // 约 30% 的机会是中等亮度金色
		                    // 偏暖/中亮金色调
		                    r = 220;
		                    g = Math.floor(150 + Math.random() * 50); // 150-200
		                    b = Math.floor(0 + Math.random() * 50);
		                } else { // 约 50% 的机会是偏暗的金色，或者少量绿色作为阴影底色
		                    // 保持一些深度/阴影色
		                    r = Math.floor(100 + Math.random() * 80); // 100-180 (偏橙黄)
		                    g = Math.floor(50 + Math.random() * 80); // 50-130
		                    b = Math.floor(0 + Math.random() * 20);
		                }
		                
		                this.color = `rgba(${r}, ${g}, ${b},`; 
		                // --- END: 树叶颜色修改区域 ---
		            }

            // 计算球体目标位置 (随机分布在一个球面上)
            <!-- const phi = Math.acos(2 * Math.random() - 1); -->
            <!-- const theta = Math.random() * 2 * Math.PI; -->
            <!-- this.targetX = EXPLOSION_RADIUS * Math.sin(phi) * Math.cos(theta); -->
            <!-- this.targetY = EXPLOSION_RADIUS * Math.sin(phi) * Math.sin(theta); -->
            <!-- this.targetZ = EXPLOSION_RADIUS * Math.cos(phi); -->
			
			const heartTarget = getHeartTarget(EXPLOSION_RADIUS);
            this.targetX = heartTarget.x;
            this.targetY = heartTarget.y;
            this.targetZ = heartTarget.z;
        }

// 在 class Particle 中替换 update 方法...

        // 重写 update 以处理状态切换
        update(rotation, time) {
            let currentX = this.baseX;
            let currentY = this.y;
            let currentZ = this.baseZ;
            // 默认使用传入的全局旋转视角
            let effectiveRotation = rotation;

            if (animationState === 'exploding') {
                const progress = Math.min(1, (time - explosionStartTime) / EXPLOSION_TIME);
                // 线性插值过渡
                currentX = this.baseX + (this.targetX - this.baseX) * progress;
                currentY = this.y + (this.targetY - this.y) * progress;
                currentZ = this.baseZ + (this.targetZ - this.baseZ) * progress;

            } else if (animationState === 'ball') {
                // 粒子到达心形目标位置
                currentX = this.targetX;
                currentY = this.targetY;
                currentZ = this.targetZ;
                
                // [关键修改]：当形成心形后，强制旋转角度为 0。
                // 这样无论鼠标如何移动，心形都保持正对屏幕不动。
                effectiveRotation = 0;
            }
            
            // 使用计算出的位置和有效的旋转角度进行投影
            const p = this.project(currentX, currentY, currentZ, effectiveRotation);
            this.screenX = p.sx;
            this.screenY = p.sy;
            this.scale = p.scale;
            this.z = p.rz;
        }

        draw(ctx) {
            // ... (draw logic remains the same)
            if (this.scale <= 0) return;
            const alpha = this.type === 'leaf' 
                ? 0.5 + 0.5 * Math.sin(Date.now() * 0.003 + this.twinkleOffset)
                : 0.9;
            
            ctx.fillStyle = this.color + alpha + ')';
            ctx.beginPath();
            ctx.arc(this.screenX, this.screenY, this.sizeBase * this.scale, 0, Math.PI * 2);
            ctx.fill();
        }
    }

// 悬挂摆动的星星 (参与心形组成)
    class HangingStar extends Point3D {
        constructor(anchorX, anchorY, anchorZ) {
            super(anchorX, anchorY, anchorZ);
            this.anchorBaseX = anchorX;
            this.anchorBaseY = anchorY;
            this.anchorBaseZ = anchorZ;
            this.anchorScreen = {x:0, y:0};

            this.stringLength = Math.random() * 40 + 10;
            this.starSize = Math.random() * 5 + 2;
            this.swingSpeed = Math.random() * 0.002 + 0.001;
            this.swingPhase = Math.random() * Math.PI * 2;
            this.maxSwingAngle = Math.random() * 0.5 + 0.1;
            this.hue = Math.random() > 0.7 ? 50 : (Math.random() > 0.5 ? 200 : 330);
            
            // 新增：计算心形目标，让星星在爆炸后也组成心形
            const heartTarget = getHeartTarget(EXPLOSION_RADIUS);
            this.targetX = heartTarget.x;
            this.targetY = heartTarget.y;
            this.targetZ = heartTarget.z;
        }

        update(rotation, time) {
            if (animationState === 'exploding' || animationState === 'ball') {
                // 在爆炸和心形状态下，星星不再摆动，而是移向心形目标位置
                
                let currentX = this.baseX;
                let currentY = this.y;
                let currentZ = this.baseZ;

                if (animationState === 'exploding') {
                    const progress = Math.min(1, (time - explosionStartTime) / EXPLOSION_TIME);
                    // 线性插值，从树上的位置 (baseXYZ) 移向心形目标位置 (targetXYZ)
                    currentX = this.baseX + (this.targetX - this.baseX) * progress;
                    currentY = this.y + (this.targetY - this.y) * progress;
                    currentZ = this.baseZ + (this.targetZ - this.baseZ) * progress;
                } else if (animationState === 'ball') {
                    // 粒子已经到达心形目标位置
                    currentX = this.targetX;
                    currentY = this.targetY; 
                    currentZ = this.targetZ;
                }

                // 旋转和投影基于当前位置
                const p = this.project(currentX, currentY, currentZ, rotation);
                this.screenX = p.sx;
                this.screenY = p.sy;
                this.scale = p.scale;
                this.z = p.rz;
                return; // 爆炸后退出正常摆动逻辑
            }

            // --------------------------------
            // 原有树形摆动逻辑 (只有在 animationState === 'tree' 时执行)
            // 1. 计算锚点的投影坐标
            const projAnchor = this.project(this.anchorBaseX, this.anchorBaseY, this.anchorBaseZ, rotation);
            this.anchorScreen = { x: projAnchor.sx, y: projAnchor.sy };

            // 2. 物理摆动计算
            const currentAngle = Math.sin(time * this.swingSpeed + this.swingPhase) * this.maxSwingAngle;
            const localOffsetX = Math.sin(currentAngle) * this.stringLength;
            const localOffsetY = Math.cos(currentAngle) * this.stringLength;

            this.baseX = this.anchorBaseX + localOffsetX;
            this.y = this.anchorBaseY + localOffsetY;
            this.baseZ = this.anchorBaseZ;

            // 3. 投影
            super.update(rotation);
        }

		draw(ctx, time) {
            if (this.scale <= 0) return;

            // 1. 【绘制挂绳】：只有在 'tree' (树) 的状态下才绘制绳子
            if (animationState === 'tree') {
                ctx.beginPath();
                ctx.moveTo(this.anchorScreen.x, this.anchorScreen.y);
                ctx.lineTo(this.screenX, this.screenY);
                ctx.strokeStyle = `hsla(${this.hue}, 50%, 70%, ${0.3 * this.scale})`;
                ctx.lineWidth = 0.8 * this.scale;
                ctx.stroke();
            }

            // 2. 【绘制星星主体】：在所有状态（树、爆炸、心形）下都绘制五角星
            const s = this.starSize * this.scale;
            
            ctx.save();
            ctx.translate(this.screenX, this.screenY);
            
            // 星星自转动画
            ctx.rotate(time * 0.0005 + this.swingPhase);

            ctx.beginPath();
            // 五角星路径
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * 0.01745) * s, -Math.sin((18 + i * 72) * 0.01745) * s);
                ctx.lineTo(Math.cos((54 + i * 72) * 0.01745) * (s * 0.5), -Math.sin((54 + i * 72) * 0.01745) * (s * 0.5));
            }
            ctx.closePath();
            
            // 颜色与闪烁
            const twinkle = 0.7 + 0.3 * Math.sin(time * this.swingSpeed * 3);
            ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${twinkle})`;
            
            // 光晕效果
            ctx.shadowBlur = 8 * this.scale;
            ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 0.8)`;
            
            ctx.fill();
            ctx.restore();
        }
    }

    // 照片装饰 (在爆炸后被隐藏)
    class PhotoOrnament extends Point3D {
        // ... (constructor remains the same)
        constructor(img, x, y, z) {
            super(x, y, z);
            this.img = img;
            this.size = 50;
        }

        update(rotation) {
             if (animationState !== 'tree') {
                this.z = 10000;
                this.scale = 0;
                return;
            }
            super.update(rotation);
        }

        draw(ctx) {
             if (animationState !== 'tree') return; // 爆炸后不绘制
            // ... (draw logic remains the same)
            if (this.scale <= 0) return;
            const s = this.size * this.scale;
            ctx.save();
            ctx.translate(this.screenX, this.screenY);
            ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(0,-s-5*this.scale); 
            ctx.strokeStyle="#A87F32"; ctx.lineWidth=2*this.scale; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, s + 2*this.scale, 0, Math.PI * 2);
            ctx.fillStyle = '#CFB53B'; ctx.fill();
            ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.clip();
            ctx.drawImage(this.img, -s, -s, s * 2, s * 2);
            ctx.restore();
        }
    }

    // 背景雪花
    class Snow {
        // ... (constructor and reset methods remain the same)
        constructor() { this.reset(); this.y = Math.random() * height; }
        reset() {
            this.x = Math.random() * width; this.y = -10;
            this.z = Math.random() * 800;
            this.speed = Math.random() * 1.5 + 0.5;
            this.size = Math.random() * 2 + 0.5;
        }
        update() { this.y += this.speed; if (this.y > height) this.reset(); }
        draw(ctx) {
            const scale = PERSPECTIVE / (PERSPECTIVE + this.z);
            ctx.fillStyle = `rgba(255,255,255,${0.4*scale})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size*scale, 0, Math.PI * 2); ctx.fill();
        }
    }
	
	
	
	// 粒子雪地底座
    class SnowBaseParticle extends Point3D {
        constructor(x, y, z) {
            super(x, y, z);
            this.sizeBase = Math.random() * 2 + 1;
            this.alpha = Math.random() * 0.4 + 0.6;
            this.baseY = y; // Fixed world Y
        }
        
        // 覆盖 update 方法：只应用鼠标旋转，忽略自动旋转
        update(rotation) {
            if (animationState === 'ball') {
                this.z = 10000; 
                this.scale = 0;
                return;
            }
            
            // 仅使用鼠标旋转部分 (finalRotation - targetRotation)
            const mouseRotation = rotation - targetRotation; 

            // 投影计算
            const cos = Math.cos(mouseRotation);
            const sin = Math.sin(mouseRotation);
            
            const x = this.baseX;
            const z = this.baseZ;

            // 应用鼠标旋转
            const rx = x * cos - z * sin;
            const rz = x * sin + z * cos;

            // Perspective Projection
            const scale = PERSPECTIVE / (PERSPECTIVE + rz + Z_OFFSET);
            
            this.scale = scale;
            this.z = rz;
            this.screenX = width / 2 + rx * scale;
            this.screenY = height / 2 + this.baseY * scale; // 使用固定的世界Y
        }

        draw(ctx) {
            if (this.scale <= 0) return;
            // 细微的阴影光晕
            ctx.shadowBlur = 1 * this.scale;
            ctx.shadowColor = "rgba(255, 255, 255, 0.5)";
            
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.screenX, this.screenY, this.sizeBase * this.scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
	
	


    // ================= 初始化与动画主循环 =================

    function initScene() {
        // ... (保持不变)
        const startY = -TREE_HEIGHT / 2;
        
        // 1. 构建树叶 (正三角锥 + 混沌分布)
        for (let i = 0; i < LEAF_COUNT; i++) {
            const progress = i / LEAF_COUNT; 
            // **修改点 1：使用 Progress^2/3 使底部粒子密度更高，上面更稀疏**
            const progressCurve = Math.pow(progress, 0.66); // 0.66 < 1，使 Y 轴更倾向于底部
            
            const y = startY + progressCurve * TREE_HEIGHT;
            const idealRadius = progressCurve * TREE_WIDTH;
            const angle = i * 1.375 + Math.random()*0.2;
            const distRatio = Math.random() > 0.2 ? 1 : Math.sqrt(Math.random());
            const dist = idealRadius * distRatio;
            particles.push(new Particle(Math.cos(angle) * dist, y, Math.sin(angle) * dist, 'leaf'));
        }

        // 2. 构建树干
        // **修改点 2：树干从树顶开始，一直延伸到雪地 Y 坐标**
        const trunkTopY = startY + 700; // 树干从树顶开始
        const trunkHeightTotal = TREE_HEIGHT + TRUNK_HEIGHT; // 树高 + 额外底座高度
        for (let i = 0; i < TRUNK_COUNT; i++) {
            // Y 轴贯穿整个树的范围
            const y = trunkTopY + Math.random() * trunkHeightTotal; 
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * TRUNK_WIDTH;
            particles.push(new Particle(Math.cos(angle)*dist, y, Math.sin(angle)*dist, 'trunk'));
        }

        // 3. 构建悬挂的星星
        for (let i = 0; i < HANGING_STAR_COUNT; i++) {
            const rawProgress = Math.random();
            // **修改点 3：星星也使用 Progress^2/3 优化分布**
            const progress = 0.1 + Math.pow(rawProgress, 0.66) * 0.8; // 保证星星不挂在树尖上

            const y = startY + progress * TREE_HEIGHT;
            const radius = progress * TREE_WIDTH;
            const angle = Math.random() * Math.PI * 2;
            particles.push(new HangingStar(Math.cos(angle)*radius, y, Math.sin(angle)*radius));
        }
        
        // ... (PhotoOrnament 和 SnowBaseParticle 部分保持不变)
        
        for (let i = 0; i < SNOW_BASE_COUNT; i++) {
            const x = (Math.random() - 0.5) * BASE_RANGE * 2;
            const z = (Math.random() - 0.5) * BASE_RANGE * 2;
            particles.push(new SnowBaseParticle(x, SNOW_BASE_Y_WORLD, z));
        }

        if (loadedImages.length > 0) {
            for (let i = 0; i < loadedImages.length; i++) {
                const progress = 0.25 + (i / loadedImages.length) * 0.6;
                const y = startY + progress * TREE_HEIGHT;
                const radius = progress * TREE_WIDTH + 15;
                const angle = (i / loadedImages.length) * Math.PI * 6;
                particles.push(new PhotoOrnament(loadedImages[i], Math.cos(angle)*radius, y, Math.sin(angle)*radius));
            }
        }

        for(let i=0; i<SNOW_COUNT; i++) snow.push(new Snow()); // 使用 SNOW_COUNT
    }


    // 绘制树顶大星
    function drawTopStar(ctx, rotation, time) {
        if (animationState !== 'tree') return; // 爆炸后隐藏树顶星
        const topY = -TREE_HEIGHT / 2 - 35;
        const p = new Point3D(0, topY, 0);
        const proj = p.project(0, topY, 0, rotation);
        
        ctx.save();
        ctx.translate(proj.sx, proj.sy);
        ctx.rotate(time * 0.0003);
        ctx.shadowBlur = 40 * proj.scale;
        ctx.shadowColor = "rgba(255, 223, 0, 0.9)";
        ctx.beginPath(); const r = 22 * proj.scale;
        for(let i=0;i<5;i++){
            ctx.lineTo(Math.cos((18+i*72)*0.017)*r, -Math.sin((18+i*72)*0.017)*r);
            ctx.lineTo(Math.cos((54+i*72)*0.017)*(r*0.4), -Math.sin((54+i*72)*0.017)*(r*0.4));
        }
        ctx.closePath(); ctx.fillStyle = "#FFFACD"; ctx.fill(); ctx.restore();
    }


    // ================= 状态控制函数 =================

    function explodeTree() {
        if (animationState !== 'tree') return;

        animationState = 'exploding';
        explosionStartTime = Date.now();
        document.getElementById('explodeButton').style.display = 'none';
        document.querySelector('.text-overlay').textContent = '...';

        // 设定爆炸结束定时器
        setTimeout(() => {
            animationState = 'ball';
            document.querySelector('.text-overlay').style.display = 'none';
            document.getElementById('messageOverlay').style.opacity = 1;
        }, EXPLOSION_TIME + 200); // 略微多一点时间
    }

    // 绑定按钮事件
    document.getElementById('explodeButton').addEventListener('click', explodeTree);


    function animate() {
        ctx.clearRect(0, 0, width, height);
        const time = Date.now();
        
        // 旋转逻辑
        if (animationState === 'exploding') {
            // 在爆炸期间加快旋转速度，增加动态感
            targetRotation += autoRotationSpeed * 3; 
        } else {
            targetRotation += autoRotationSpeed;
        }
        const finalRotation = targetRotation + mouseX * 3;


        // 2. 绘制背景雪花
        snow.forEach(s => { s.update(); s.draw(ctx); });

        // 3. 更新所有3D对象位置 (传入 time 用于物理计算)
        particles.forEach(p => {
            if (p instanceof HangingStar || p instanceof PhotoOrnament) {
                p.update(finalRotation, time); // 挂饰/照片
            } else {
                p.update(finalRotation, time); // 粒子 (包含爆炸逻辑)
            }
        });

        // 4. 深度排序
        particles.sort((a, b) => b.z - a.z);

        // 5. 绘制
        particles.forEach(p => {
            if (p instanceof HangingStar) p.draw(ctx, time);
            else if (p instanceof PhotoOrnament) p.draw(ctx);
            else p.draw(ctx);
        });

        // 6. 绘制树顶大星
        drawTopStar(ctx, finalRotation, time);
        
        requestAnimationFrame(animate);
    }

    preloadImages(imgUrls, () => {
        const loading = document.getElementById('loading');
        loading.style.opacity = 0;
        setTimeout(() => loading.remove(), 800);
        initScene();
        animate();
    });

</script>
